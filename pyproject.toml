[project]
name = "routeconv"
version = "0.1.0"
description = "Convert route patterns between Flask/Werkzeug and Express syntax"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mjohnson106" }]
dependencies = []

[project.scripts]
routeconv = "routeconv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
